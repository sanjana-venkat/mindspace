name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate release scripts and property lists
        run: |
          bash -n scripts/build_app.sh scripts/release.sh scripts/publish.sh
          plutil -lint AppResources/Info.plist AppResources/Mindspace.entitlements
      - name: Run tests
        run: swift test
